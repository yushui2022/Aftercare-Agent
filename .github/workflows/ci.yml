name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # uv 0.9.26's bundled Python download index stops at 3.13.11, but the
    # project pins 3.13.15 (.python-version / requires-python).  Point uv at a
    # pinned, immutable copy of its own download metadata so that both
    # `uv python install 3.13.15` and the implicit interpreter resolution in
    # `uv sync --locked` can find the pinned patch.  Without this the job fails
    # at the "Set up Python" step before any check or test runs.
    # The equivalent local workaround is documented in docs/development.md.
    env:
      UV_PYTHON_DOWNLOADS_JSON_URL: https://raw.githubusercontent.com/astral-sh/uv/dbda4fbf33602f64b32a5b6873d730c5afb838fa/crates/uv-python/download-metadata.json
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aftercare
          POSTGRES_USER: aftercare
          POSTGRES_PASSWORD: ci-only-aftercare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aftercare -d aftercare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13.15
      - name: Install locked dependencies
        run: uv sync --locked
      - name: PostgreSQL 17 client tools for the restore drill
        # The service below is postgres:17, and pg_dump refuses to read a server
        # newer than itself while the runner image ships an older client.  If
        # this step cannot run, the drill's tests skip with the reason instead
        # of failing the job for an unrelated packaging problem.
        continue-on-error: true
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version
      - name: Static checks
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked mypy aftercare_agent tests evals
      - name: Test with PostgreSQL
        env:
          DATABASE_URL: postgresql://aftercare:ci-only-aftercare@127.0.0.1:5432/aftercare
        run: uv run --locked pytest -q --tb=short
