# Run after migration-job.yaml and before the API/Worker Deployments. Replace
# the image reference with the same immutable digest used by both workloads.
apiVersion: batch/v1
kind: Job
metadata:
  name: aftercare-rls-check
  namespace: aftercare
  labels:
    app.kubernetes.io/name: aftercare-rls-check
    app.kubernetes.io/component: tenant-isolation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aftercare-rls-check
        app.kubernetes.io/component: tenant-isolation
    spec:
      restartPolicy: Never
      serviceAccountName: aftercare
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rls-check
          image: registry.example/aftercare-agent@sha256:replace-me
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              aftercare-rls verify
              --runtime-role "$AFTERCARE_RUNTIME_DATABASE_ROLE"
              --image "$AFTERCARE_IMAGE"
          env:
            - name: DATABASE_URL_FILE
              value: /run/secrets/aftercare_database_url
            - name: AFTERCARE_REQUIRE_DATABASE_TLS
              value: "1"
            # Keep this value byte-for-byte equal to the image reference above.
            - name: AFTERCARE_IMAGE
              value: registry.example/aftercare-agent@sha256:replace-me
            - name: AFTERCARE_RUNTIME_DATABASE_ROLE
              value: aftercare_runtime
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: runtime-database-url
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: runtime-database-url
          secret:
            secretName: aftercare-runtime-database-url
            defaultMode: 256
