services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aftercare
      POSTGRES_USER: aftercare
      POSTGRES_PASSWORD: local-only-aftercare
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aftercare -d aftercare"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${AFTERCARE_POSTGRES_PORT:-55433}:5432"
    volumes:
      - aftercare-postgres:/var/lib/postgresql/data

  api:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgresql://aftercare:local-only-aftercare@postgres:5432/aftercare
      AFTERCARE_AUTO_MIGRATE: "1"
      # Synthetic identity is intentionally enabled only for local development.
      AFTERCARE_ALLOW_SYNTHETIC_IDENTITY: "1"
      # Bounded pool, one per process: the API serves requests concurrently,
      # so it gets the default ceiling.  See docs/decisions/0006-*.md.
      AFTERCARE_DB_POOL_MIN_SIZE: "${AFTERCARE_DB_POOL_MIN_SIZE:-1}"
      AFTERCARE_DB_POOL_MAX_SIZE: "${AFTERCARE_DB_POOL_MAX_SIZE:-8}"
      AFTERCARE_DB_ACQUIRE_TIMEOUT_SECONDS: "${AFTERCARE_DB_ACQUIRE_TIMEOUT_SECONDS:-5}"
      # Pool health: one JSON line per sample on the process log (ADR-0007).
      # There is no exporter yet, so the log is the sink a deployment gets.
      AFTERCARE_POOL_METRICS: "${AFTERCARE_POOL_METRICS:-1}"
      AFTERCARE_POOL_METRICS_INTERVAL_SECONDS: "${AFTERCARE_POOL_METRICS_INTERVAL_SECONDS:-10}"
      AFTERCARE_METRICS_BACKEND: "${AFTERCARE_METRICS_BACKEND:-logging}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AFTERCARE_API_PORT:-8000}:8000"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    profiles: [worker]
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "aftercare_agent.runtime.worker_cli"]
    environment:
      DATABASE_URL: postgresql://aftercare:local-only-aftercare@postgres:5432/aftercare
      AFTERCARE_AUTO_MIGRATE: "1"
      AFTERCARE_TENANT_ID: "${AFTERCARE_TENANT_ID:-}"
      AFTERCARE_RUN_ID: "${AFTERCARE_RUN_ID:-}"
      AFTERCARE_WORKER_ID: "${AFTERCARE_WORKER_ID:-worker-compose}"
      AFTERCARE_WORKER_DAEMON: "${AFTERCARE_WORKER_DAEMON:-0}"
      AFTERCARE_MAX_STEPS: "${AFTERCARE_MAX_STEPS:-8}"
      AFTERCARE_LEASE_SECONDS: "${AFTERCARE_LEASE_SECONDS:-30}"
      AFTERCARE_IDLE_SLEEP_SECONDS: "${AFTERCARE_IDLE_SLEEP_SECONDS:-1}"
      # One slice thread plus its heartbeat need two connections; the ceiling
      # is a little above that rather than an API-sized pool.
      AFTERCARE_DB_POOL_MIN_SIZE: "${AFTERCARE_DB_POOL_MIN_SIZE:-1}"
      AFTERCARE_DB_POOL_MAX_SIZE: "${AFTERCARE_DB_POOL_MAX_SIZE:-4}"
      AFTERCARE_DB_ACQUIRE_TIMEOUT_SECONDS: "${AFTERCARE_DB_ACQUIRE_TIMEOUT_SECONDS:-5}"
      AFTERCARE_POOL_METRICS: "${AFTERCARE_POOL_METRICS:-1}"
      AFTERCARE_POOL_METRICS_INTERVAL_SECONDS: "${AFTERCARE_POOL_METRICS_INTERVAL_SECONDS:-10}"
      AFTERCARE_QUEUE_METRICS: "${AFTERCARE_QUEUE_METRICS:-1}"
      AFTERCARE_QUEUE_METRICS_INTERVAL_SECONDS: "${AFTERCARE_QUEUE_METRICS_INTERVAL_SECONDS:-10}"
      AFTERCARE_METRICS_BACKEND: "${AFTERCARE_METRICS_BACKEND:-logging}"
    depends_on:
      api:
        condition: service_healthy

volumes:
  aftercare-postgres:
